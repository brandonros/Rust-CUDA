[package]
name = "vecadd"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Select LLVM 21 kernel options (default arch -> Compute100 / Blackwell).
# RUST_CUDA_CODEGEN_BACKEND must point to a separately built LLVM 21 backend.
llvm21 = ["cuda_builder/llvm21"]

[dependencies]
cust = { path = "../../crates/cust" }
cust_raw = { path = "../../crates/cust_raw", default-features = false, features = ["driver"] }
nanorand = "0.7"

[build-dependencies]
cuda_builder = { workspace = true, default-features = false }
