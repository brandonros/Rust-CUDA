[package]
name = "cuda_builder"
version = "0.3.0"
edition = "2024"
authors = ["Riccardo D'Ambrosio <rdambrosio016@gmail.com>", "The rust-gpu Authors"]
license = "MIT OR Apache-2.0"
description = "Builder for easily building rustc_codegen_nvvm crates"
repository = "https://github.com/Rust-GPU/rust-cuda"
readme = "../../README.md"

[package.metadata.docs.rs]
no-default-features = true

[features]
default = []
# Select modern-backend options and default architecture (Compute100).
# The caller supplies a backend built separately with the matching LLVM flavor.
llvm21 = ["nvvm/llvm21"]

[dependencies]
nvvm = { path = "../nvvm", version = "0.1" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
