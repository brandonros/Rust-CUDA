name: Export portable PTX

on:
  workflow_dispatch:
    inputs:
      cleanup_experiment:
        description: Replay LLVM 19 handoff IR with opt-in cleanup passes
        type: boolean
        default: false
  push:
    branches: [poc/portable-ptx-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          # Include all nested builds, notably target/cuda-builder-codegen.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ptx-cargo-v1-${{ runner.os }}-${{ runner.arch }}-llvm19-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/**', '.github/workflows/ptx_export.yml') }}-${{ github.sha }}
          restore-keys: |
            ptx-cargo-v1-${{ runner.os }}-${{ runner.arch }}-llvm19-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/**', '.github/workflows/ptx_export.yml') }}-
      - name: Test codegen inventory parser
        run: python3 -m unittest discover -s examples/ptx_export -p test_inspect_codegen.py
      - name: Check guarded-select source semantics on CPU
        run: |
          nix develop .#v19 --command rustc --edition=2024 --test examples/ptx_export/kernels/src/guarded_select.rs -o /tmp/guarded-select-debug
          /tmp/guarded-select-debug
          nix develop .#v19 --command rustc --edition=2024 -O --test examples/ptx_export/kernels/src/guarded_select.rs -o /tmp/guarded-select-release
          /tmp/guarded-select-release
      - name: Compile Rust kernels without a GPU
        run: |
          mkdir -p artifacts/ptx
          printf '%s\n' 'nix develop .#v19 --command cargo run -vv -p ptx_export --features llvm19 -- artifacts/ptx' > artifacts/ptx/build-command.txt
          nix develop .#v19 --command cargo run -vv -p ptx_export --features llvm19 -- artifacts/ptx 2>&1 | tee artifacts/ptx/build.log
      - name: Verify LLVM 19 handoff IR
        run: nix develop .#v19 --command opt-19 -passes=verify -disable-output artifacts/ptx/final-module.ll
      - name: Record provenance
        run: |
          git rev-parse HEAD > artifacts/ptx/source-commit.txt
          nix develop .#v19 --command rustc -Vv > artifacts/ptx/rustc-version.txt
          nix develop .#v19 --command nvcc --version > artifacts/ptx/nvcc-version.txt
          cp flake.lock rust-toolchain.toml Cargo.lock artifacts/ptx/
          # Keep per-crate LLVM IR as well as the linked final-module.ll.
          mkdir -p artifacts/ptx/llvm-ir
          find target/nvptx64-nvidia-cuda -name '*.ll' -exec cp --parents '{}' artifacts/ptx/llvm-ir/ \;
      - name: Assemble and inspect NVIDIA machine code without a GPU
        run: nix develop .#v19 --command python3 examples/ptx_export/inspect_codegen.py artifacts/ptx
      - name: Investigate pre-NVVM cleanup (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_experiment }}
        run: nix develop .#v19 --command python3 examples/ptx_export/replay_cleanup.py artifacts/ptx
      - name: Validate integrated cleanup against replay (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_experiment }}
        run: nix develop .#v19 --command python3 examples/ptx_export/check_integrated_cleanup.py artifacts/ptx
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-ptx
          path: artifacts/ptx/
          if-no-files-found: error
      - name: Save Cargo cache, including after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
