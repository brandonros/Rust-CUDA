name: Export portable PTX

on:
  workflow_dispatch:
  push:
    branches: [poc/portable-ptx-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          # Include all nested builds, notably target/cuda-builder-codegen.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ptx-cargo-v1-${{ runner.os }}-${{ runner.arch }}-llvm19-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/**', '.github/workflows/ptx_export.yml') }}-${{ github.sha }}
          restore-keys: |
            ptx-cargo-v1-${{ runner.os }}-${{ runner.arch }}-llvm19-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.cargo/**', '.github/workflows/ptx_export.yml') }}-
      - name: Compile Rust kernels without a GPU
        run: nix develop .#v19 --command cargo run -p ptx_export --features llvm19 -- artifacts/ptx
      - name: Record provenance
        run: |
          git rev-parse HEAD > artifacts/ptx/source-commit.txt
          nix develop .#v19 --command rustc -Vv > artifacts/ptx/rustc-version.txt
          sha256sum artifacts/ptx/rust_kernels.ptx > artifacts/ptx/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ptx
          path: artifacts/ptx/
          if-no-files-found: error
      - name: Save Cargo cache, including after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
