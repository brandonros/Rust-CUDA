name: LLVM 19 optimization wave 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare ${{ matrix.workload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        workload: [small, representative, solana, bitcoin, ethereum, shallenge, self_test]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: wave2-cargo-${{ runner.os }}-llvm19-${{ github.sha }}
          restore-keys: |
            ptx-cargo-v1-${{ runner.os }}-${{ runner.arch }}-llvm19-
      - name: Build the checked-out backend
        run: |
          nix develop .#v19 --command cargo build -p rustc_codegen_nvvm --features llvm19 --target-dir target/cuda-builder-codegen
          rm -rf target/nvptx64-nvidia-cuda
      - name: Checkout pinned workload
        uses: actions/checkout@v4
        with:
          repository: brandonros/vanity-miner-rs
          ref: 9791234249fc8cb762c296c4fda4503d2686ff77
          path: workloads/vanity-miner
      - name: Compile and compare
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          sha256sum target/cuda-builder-codegen/debug/librustc_codegen_nvvm.so > artifacts/backend-sha256.txt
          nix develop .#v19 --command rustc -Vv > artifacts/rustc-version.txt
          cp flake.lock Cargo.lock rust-toolchain.toml artifacts/
          nix develop .#v19 --command python3 examples/ptx_export/run_wave2.py ${{ matrix.workload }} --out artifacts/${{ matrix.workload }} --miner workloads/vanity-miner
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wave2-${{ matrix.workload }}
          path: artifacts/
          if-no-files-found: error
